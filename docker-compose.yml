# SynapseOps — Docker Compose Principal
# Distribución en laboratorio UPAO

# Uso:
#   docker compose pull && docker compose up -d      ← laboratorio
#   docker compose up -d --build                     ← desarrollo con build local

# Requisitos mínimos del host: 8 GB RAM, 4 núcleos CPU


name: synapseops

services:

  # ── 1. POSTGRES ───────────────────────────────────────────────────────────
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 2. KAFKA BROKER — KRaft sin ZooKeeper ────────────────────────────────
  kafka-broker:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"   
      - "9094:9094"   
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 3. MLFLOW SERVER ──────────────────────────────────────────────────────
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.21.3
    container_name: mlflow-server
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
    environment:
      MLFLOW_ALLOW_HTTP_REDIRECTS: "true"
      MLFLOW_ENABLE_PROXY_FIX: "true"  
    volumes:
      - mlflow_db:/mlflow
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ── 4. CADVISOR ───────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      # Conjunto validado en ADR-003 §6.1. /rootfs + /var/run son necesarios para
      # que cAdvisor enumere los contenedores (sin ellos solo reporta el cgroup raíz).
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - mlops-network
    command:
      - "--housekeeping_interval=1s"
      - "--docker_only=true"
      - "--disable_metrics=disk,network,tcp,udp,percpu,sched,process"

  # ── 5. PROMETHEUS ─────────────────────────────────────────────────────────
  prometheus-tsdb:
    image: prom/prometheus:v2.51.2
    container_name: prometheus-tsdb
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      # HU-009 · Docker SD: Prometheus descubre los model-services por el socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9090:9090"
    networks:
      - mlops-network
    depends_on:
      - cadvisor

  # ── 6. GRAFANA ────────────────────────────────────────────────────────────
  grafana-dashboard:
    image: grafana/grafana:10.4.2
    container_name: grafana-dashboard
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - mlops-network
    depends_on:
      - prometheus-tsdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 7. BACKEND ORCHESTRATOR  ────────────────────────
  backend-orchestrator:
    image: ${REGISTRY:-synapseops}/backend-orchestrator:${APP_VERSION:-1.0.0}
    build:
      context: ./Backend/backend-orchestrator
      dockerfile: Dockerfile
    container_name: backend-orchestrator
    restart: unless-stopped
    # Comparte el volumen /storage con ml-engine (que corre como root). Sin un UID
    # común, los directorios que crea ml-engine (root) no son escribibles por el
    # usuario por defecto del orquestador → AccessDenied al ingestar datasets.
    # Se unifica el UID corriendo ambos como root sobre el volumen compartido.
    user: "0:0"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres-db:5432/orchestrator
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-36000000}
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      STORAGE_BASE_PATH: /storage
      STORAGE_MAX_FILE_SIZE_MB: ${STORAGE_MAX_FILE_SIZE_MB:-500}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      MODEL_SERVICE_TEMPLATE_DIR: /app/model-service-template
    volumes:
      - storage_data:/storage
      - /var/run/docker.sock:/var/run/docker.sock
      # Plantilla TA-007 del model-service (HU-007 la usa como contexto de build).
      - ./Backend/model-service:/app/model-service-template:ro
    ports:
      - "8080:8080"
    networks:
      - mlops-network
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

   # ── 8. ML ENGINE ──────────────────────────────────────────────────────────
  ml-engine:
    image: ${REGISTRY:-synapseops}/ml-engine:${APP_VERSION:-1.0.0}
    build:
      context: ./Backend/ml-engine
      dockerfile: Dockerfile
    container_name: ml-engine
    restart: unless-stopped
    user: "0:0" 
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      STORAGE_BASE_PATH: /storage
      LOG_LEVEL: info
    volumes:
      - storage_data:/storage
    ports:
      - "8000:8000"
    networks:
      - mlops-network
    depends_on:
      kafka-broker:
        condition: service_healthy
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 8. FRONTEND ──────────────────────────────────────────────────────────
  frontend-app:
    image: ${REGISTRY:-synapseops}/frontend-app:${APP_VERSION:-1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1    
    container_name: frontend-app
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - mlops-network
    depends_on:
      backend-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s  

volumes:
  postgres_data:
  kafka_data:
  mlflow_db:
  mlflow_artifacts:
  grafana_data:
  prometheus_data:
  storage_data:

networks:
  mlops-network:
    driver: bridge
    name: mlops-network