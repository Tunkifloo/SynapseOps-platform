name: SynapseOps CI/CD

run-name: "${{ github.actor }} → ${{ github.ref_name }} @ ${{ github.sha }}"

# CI en develop y main; CD (build + push a GHCR) solo en main y en tags de release v*.
# Los tests de integración (Testcontainers) NO corren aquí: requieren el daemon
# Docker local (WSL2 + dockerd) y se ejecutan vía `make test-it` / Gitea local.
on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io

# Necesario para que GITHUB_TOKEN pueda publicar imágenes en GHCR (Packages).
permissions:
  contents: read
  packages: write

jobs:

  # ── JOB 1: Lint + Tests Unitarios (backend + frontend) ─────────────────────
  unit-validation:
    name: "Lint + Unit Tests (backend + frontend)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Configurar Node ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Runners Linux = filesystem case-sensitive. La carpeta en el remoto es
      # 'frontend' (minúscula); usar 'Frontend' rompe el checkout/build.
      - name: "Instalar dependencias frontend"
        run: cd frontend && npm ci --prefer-offline

      - name: "Asegurar permiso de ejecución de mvnw"
        run: chmod +x Backend/backend-orchestrator/mvnw

      - name: "make lint (Checkstyle + ESLint)"
        run: make lint

      - name: "make test (backend · JUnit 5 + Mockito, perfil unit)"
        run: make test

      - name: "Tests frontend (Vitest + RTL)"
        run: cd frontend && npm run test

  # ── JOB 2: Tests ml-engine (pytest · ingesta, sin TensorFlow) ──────────────
  ml-engine-tests:
    name: "ML Engine Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Instalar dependencias de test (ligeras)"
        run: pip install --quiet pytest numpy Pillow pydantic pydantic-settings

      - name: "pytest (ingesta de datasets)"
        run: cd Backend/ml-engine && python -m pytest tests/ -q

  # ── JOB 3: Build & Push de imágenes → GHCR (solo main + tags v*) ───────────
  build-and-push:
    name: "Build & Push → GHCR (${{ matrix.name }})"
    runs-on: ubuntu-latest
    needs: [ unit-validation, ml-engine-tests ]
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-orchestrator
            context: Backend/backend-orchestrator
            build-args: ""
          - name: ml-engine
            context: Backend/ml-engine
            build-args: ""
          - name: frontend-app
            context: frontend
            build-args: |
              VITE_API_BASE_URL=/api/v1
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      # GHCR exige el owner en minúsculas en la ruta de la imagen.
      - name: "Owner del repo en minúsculas"
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: "Login a GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versionado: 'latest' + 'sha-<corto>' en main; SemVer (1.2.3 y 1.2) en tags v*.
      - name: "Metadata (tags + labels OCI)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: "Configurar Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build & Push (${{ matrix.name }})"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          # Cache de capas GHA para acelerar (clave para ml-engine: TF+PyTorch).
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
