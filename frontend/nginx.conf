server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permitir uploads de datasets hasta 500 MB
    client_max_body_size 500m;

    # React Router — todas las rutas SPA retornan index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend — el frontend llama /api/v1/... y nginx lo reenvía
    location /api/ {
        proxy_pass         http://backend-orchestrator:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Origin            $http_origin;
        # El deploy es síncrono e incluye el build de la imagen del model-service
        # (instalar tensorflow-cpu/torch puede tardar varios minutos en discos lentos).
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        # SSE (consola de logs en tiempo real): sin buffering para streamear los eventos.
        proxy_buffering    off;
    }

    # Proxy al actuator (health checks)
    location /actuator/ {
        proxy_pass http://backend-orchestrator:8080/actuator/;
    }

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Cache para assets con hash (Vite genera hashes en nombres de archivo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}