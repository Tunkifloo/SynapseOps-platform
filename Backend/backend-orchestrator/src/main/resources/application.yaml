spring:
  config:
    import: optional:file:.env[.properties]

  codec:
    max-in-memory-size: 10MB

  # ── Multipart (WebFlux) ────────────────────────────────────────────────────
  # Tope REAL de subida: WebFlux aborta la parte en streaming si supera
  # max-disk-usage-per-part (no depende del header Content-Length). Se ata al
  # mismo STORAGE_MAX_FILE_SIZE_MB que valida el dominio → una sola fuente de verdad.
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: ${STORAGE_MAX_FILE_SIZE_MB:500}MB
      max-parts: 16

  application:
    name: backend-orchestrator

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mustache:
    check-template-location: false

  # ── Base de datos ──────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orchestrator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OrchestratorHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
        '[use_sql_comments]': true
        '[jdbc.batch_size]': 20

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    baseline-version: 0

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: orchestrator-results-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

  web:
    error:
      include-message: always
      include-binding-errors: always

# ── Servidor ──────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:36000000}

# ── Admin por defecto  ────────────────────────────────────────
admin:
  default:
    username: ${ADMIN_USERNAME:superadmin}
    password: ${ADMIN_PASSWORD:SuperPassword2026!}
    email: ${ADMIN_EMAIL:admin@synapseops.pe}

# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  tracking:
    uri: ${MLFLOW_TRACKING_URI:http://localhost:5000}

# ── SynapseOps · Despliegue dinámico ───────────────────────────────────────────
synapseops:
  model-service:
    # Plantilla TA-007 (módulo Backend/model-service/) que se copia al contexto de
    # build del contenedor del model-service. En prod se monta como volumen.
    template-dir: ${MODEL_SERVICE_TEMPLATE_DIR:/app/model-service-template}
    # TA-004 · Tope de model-services concurrentes (sesión 1:1 por PC · RN-001 ≤6 GB).
    max-deployments: ${MAX_MODEL_DEPLOYMENTS:3}

# ── Actuator  ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ── SpringDoc / Swagger UI  ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
  use-management-port: false

# ── Logging estructurado ──────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.synapseops.orchestrator: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    # [traceId|actor] -> correlacion por request + auditoria de quien opera (item 2).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-NO_TRACE}|%X{actor:-anon}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-NO_TRACE}|%X{actor:-anon}] %logger{36} - %msg%n"
  file:
    name: logs/backend-orchestrator.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: logs/backend-orchestrator-%d{yyyy-MM-dd}.%i.log

storage:
  base-path: ${STORAGE_BASE_PATH:/storage}
  max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:500}
  # Cuota de disco por workspace (datasets + extracted + models + downloads).
  # Protege el host de 8 GB de llenarse; RN-001 solo cubre RAM/CPU.
  max-workspace-mb: ${STORAGE_MAX_WORKSPACE_MB:2000}
  # Extensiones aceptadas — fuente única consumida por la validación y el endpoint /storage/limits.
  allowed-extensions:
    - png
    - jpg
    - jpeg
    - zip
  allowed-types:
    - text/csv
    - image/png
    - image/jpeg