global:
  scrape_interval: 1s
  evaluation_interval: 15s
  scrape_timeout: 1s

scrape_configs:

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  - job_name: backend-orchestrator
    static_configs:
      - targets: ["backend-orchestrator:8080"]
    metrics_path: /actuator/prometheus

  - job_name: ml-engine
    static_configs:
      - targets: ["ml-engine:8000"]
    metrics_path: /metrics

  # HU-009 · model-services dinámicos (TA-002/003): autodescubrimiento por Docker SD.
  # Se scrapean solo los contenedores con label metrics=true (los inyecta el
  # orquestador en runContainer), por su IP en mlops-network y puerto interno 8000.
  - job_name: model-service
    metrics_path: /metrics
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_metrics]
        regex: "true"
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: "mlops-network"
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: "$1:8000"
      - source_labels: [__meta_docker_container_label_com_synapseops_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
        replacement: "$1"