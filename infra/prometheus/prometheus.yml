global:
  scrape_interval: 1s
  evaluation_interval: 15s
  scrape_timeout: 1s

scrape_configs:

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  - job_name: backend-orchestrator
    static_configs:
      - targets: ["backend-orchestrator:8080"]
    metrics_path: /actuator/prometheus

  - job_name: ml-engine
    static_configs:
      - targets: ["ml-engine:8000"]
    metrics_path: /metrics