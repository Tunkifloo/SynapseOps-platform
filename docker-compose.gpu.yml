# ── Override para entrenar con GPU NVIDIA (PC personal o labs con RTX) ──────────
#
# PC SIN GPU (laboratorio estándar): el código hace fallback automático a CPU.
#   docker compose up -d
#
# PC CON GPU NVIDIA (driver + NVIDIA Container Toolkit instalados):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build ml-engine
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# El build-arg compila el ml-engine con TensorFlow[and-cuda] + PyTorch CUDA;
# `deploy.resources` expone la GPU al contenedor. El executor autodetecta la GPU
# (tf.config / torch.cuda) y entrena en ella; si no hay, usa CPU.

services:
  ml-engine:
    # Nombre LOCAL propio (distinto del CD en GHCR, que es CPU). Así compose usa
    # esta imagen GPU si existe y la construye si falta — nunca hace pull del CD.
    # No se ve afectado por REGISTRY/APP_VERSION del .env.
    image: synapseops/ml-engine:gpu
    build:
      args:
        REQUIREMENTS: requirements-gpu.txt
    environment:
      # Asegura que CUDA sea visible dentro del contenedor.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
