name: SynapseOps CI Pipeline

run-name: "${{ gitea.actor }} → ${{ gitea.ref_name }} @ ${{ gitea.sha }}"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  BACKEND_IMAGE: "synapseops/backend-orchestrator"
  FRONTEND_IMAGE: "synapseops/frontend-app"

jobs:

  # ── JOB 1: Lint + Tests Unitarios (backend + frontend) ───────────────────
  unit-validation:
    name: "Lint + Unit Tests (backend + frontend)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Configurar Node ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Instalar dependencias frontend"
        run: cd frontend && npm ci --prefer-offline

      - name: "make lint (Checkstyle + ESLint)"
        run: make lint

      - name: "make test (backend · JUnit 5 + Mockito)"
        run: make test

      - name: "Tests frontend (Vitest + RTL)"
        run: cd frontend && npm run test

  # ── JOB 2: Tests ml-engine (pytest · ingesta, sin TensorFlow) ────────────
  ml-engine-tests:
    name: "ML Engine Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Instalar dependencias de test (ligeras)"
        run: pip install --quiet pytest numpy Pillow pydantic pydantic-settings

      - name: "pytest (ingesta de datasets)"
        run: cd Backend/ml-engine && python -m pytest tests/ -q

  # ── JOB 3: Docker Build (solo push a main) ───────────────────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [ unit-validation, ml-engine-tests ]
    if: gitea.ref == 'refs/heads/main'
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Verificar Docker disponible"
        run: docker version

      - name: "Build JAR backend (skip tests)"
        run: cd Backend/backend-orchestrator && ./mvnw package -DskipTests -q

      - name: "Build imagen Backend"
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ gitea.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            -f Backend/backend-orchestrator/Dockerfile \
            Backend/backend-orchestrator

      - name: "Build imagen Frontend"
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ gitea.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -f frontend/Dockerfile \
            frontend

      - name: "Verificar imágenes construidas"
        run: |
          docker images | grep synapseops
          echo "✔ Imágenes tag=${{ gitea.sha }}"
