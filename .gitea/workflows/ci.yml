name: SynapseOps CI Pipeline

run-name: "${{ gitea.actor }} → ${{ gitea.ref_name }} @ ${{ gitea.sha }}"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:

  # ── JOB 1: Lint + Tests Unitarios Backend ────────────────────────────────
  unit-validation:
    name: "Lint + Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Configurar Node ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Instalar dependencias frontend"
        run: cd frontend && npm ci --prefer-offline

      - name: "make lint (Checkstyle + ESLint)"
        run: make lint

      - name: "make test (JUnit 5 + Mockito — sin Docker)"
        run: make test

      # ── Frontend tests: pendiente Alfredo (Sprint 2) ──────────────────
      # TODO: descomentar cuando Vitest + RTL estén configurados
      # - name: "make test-frontend (Vitest + RTL)"
      #   run: make test-frontend

  # ── JOB 2: Build + Docker (solo push a main) ─────────────────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: corretto
          cache: maven

      - name: Build JAR backend (skip tests)
        run: cd Backend/backend-orchestrator && ./mvnw package -DskipTests -q

      - name: Build imagen Backend
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            -f Backend/backend-orchestrator/Dockerfile \
            Backend/backend-orchestrator

      - name: Build imagen Frontend
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -f frontend/Dockerfile \
            frontend

      - name: Verificar imágenes construidas
        run: |
          docker images | grep synapseops
          echo "✔ Imágenes disponibles con tag ${{ github.sha }}"